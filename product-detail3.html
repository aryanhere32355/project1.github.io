<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Laddu - Anand Kumar Sweets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .product-card {
      background: #fff4e6;
      max-width: 1000px;
      margin: 50px auto;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      gap: 30px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }

    .product-image img {
      width: 100%;
      max-width: 400px;
      border-radius: 15px;
      object-fit: cover;
    }

    .product-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-content h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #333;
    }

    .product-content p {
      font-size: 1rem;
      color: #444;
      margin-bottom: 20px;
    }

    .price {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(to right, #ff8c00, #ffa500, #ffd700);
      padding: 8px 20px;
      border-radius: 30px;
      box-shadow: 0 3px 8px rgba(255, 140, 0, 0.3);
      display: inline-block;
      margin-bottom: 20px;
      position: relative;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease-in-out;
      letter-spacing: 0.3px;
    }

    .price:hover {
      transform: scale(1.05);
    }



    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .buttons button,
    .buttons a {
      padding: 10px 18px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .back-btn {
      background-color: #ffffff;
      border: 1px solid #ccc;
      color: #333;
    }

    .order-btn {
      background-color: #007bff;
      color: white;
    }

    .back-link {
      display: inline-block;
      margin: 20px 50px;
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }

    /* --- Share Section --- */
    .share-section {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }

    .share-icon {
      width: 30px;
      height: 30px;
      cursor: pointer;
      transition: transform 0.2s;
      margin-left: 24px;
      margin-bottom: -5px;

    }

    .share-icon:hover {
      transform: scale(1.1);
    }

    .share-popup {
      display: none;
      position: absolute;
      top: 40px;
      left: 0;
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      padding: 10px 0;
      min-width: 180px;
    }

    .share-popup a {
      display: block;
      padding: 10px 20px;
      color: #444;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
    }

    .share-popup a:hover {
      background-color: #f5f5f5;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #f5f5f5;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>

<body>

  <a class="back-link" href="index.html">← Back to Home</a>

  <div class="product-card">
    <div class="product-image">
      <img src="gulabjamun.png" alt="Laddu">
    </div>
    <div class="product-content">
      <div>
        <h1>Gulab Jamun</h1>
        <p>Soft, golden brown balls made from khoya, deep-fried and soaked in fragrant rose-flavored sugar syrup. A
          timeless Indian dessert loved at every celebration!</p>
        <div class="price">₹150.00</div>

        <div class="share-section">
          <img src="share-icon.png" alt="Share" class="share-icon" onclick="toggleShareMenu()">
          <div id="share-popup" class="share-popup">
            <a href="https://api.whatsapp.com/send?text=Check out this Motichoor Laddu at Anandhav Kumar Sweets! 🍬"
              target="_blank">📱 WhatsApp</a>
            <a href="sms:?body=Check out this Motichoor Laddu at Anand Kumar Sweets!" target="_blank">📩 SMS</a>
            <a href="mailto:?subject=Motichoor Laddu&body=Check out this Motichoor Laddu at Anand Kumar Sweets! 🍬">✉️
              Email</a>
          </div>
        </div>
      </div>

      <div class="buttons">
        <a href="index.html" class="back-btn">Back to Home</a>
        <button class="order-btn" onclick="alert('You must be logged in to order!')">Contact for Order</button>
      </div>
    </div>
  </div>

  <footer>
    © 2024 Anand Kumar Sweets
  </footer>

  <script>
    function toggleShareMenu() {
      const popup = document.getElementById('share-popup');
      popup.style.display = popup.style.display === 'block' ? 'none' : 'block';

      // Auto-close popup if clicked outside
      document.addEventListener('click', function handler(e) {
        const isClickInside = popup.contains(e.target) || e.target.classList.contains('share-icon');
        if (!isClickInside) {
          popup.style.display = 'none';
          document.removeEventListener('click', handler);
        }
      });
    }
  </script>

</body>

</html>
